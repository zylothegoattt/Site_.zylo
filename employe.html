<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Plage - Espace Employé</title>
    <style>
        body {
            background-color: #f7f5f0; /* Blanc cassé effet sable */
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #2c3e50;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            border: 1px solid #e2ddd8;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        h1 {
            color: #ff7648; /* Orange soleil */
            text-align: center;
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sub {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #0097b2; /* Bleu lagon */
            font-size: 14px;
            font-weight: bold;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background: #faf9f6;
            border: 1px solid #dcd6ce;
            border-radius: 6px;
            color: #2c3e50;
            font-size: 15px;
            box-sizing: border-box;
        }
        .form-control:focus {
            outline: none;
            border-color: #0097b2;
            box-shadow: 0 0 0 3px rgba(0, 151, 178, 0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff7648 0%, #ffa85c 100%);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(255, 118, 72, 0.2);
            transition: opacity 0.2s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        .footer-links {
            margin-top: 25px;
            text-align: center;
        }
        .btn-link {
            color: #0097b2;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .btn-link:hover {
            color: #ff7648;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bar Plage</h1>
        <div class="sub">Espace Employé — Enregistrement des Ventes</div>

        <form id="saleForm">
            <div class="form-group">
                <label for="itemSelect">Article vendu :</label>
                <select id="itemSelect" class="form-control" required>
                    <option value="500">Entrée Simple (500$)</option>
                    <option value="1500">Entrée VIP (1500$)</option>
                    <option value="200">Cocktail Tropical (200$)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quantity">Quantité :</label>
                <input type="number" id="quantity" class="form-control" value="1" min="1" required>
            </div>

            <div class="form-group">
                <label>Nom du client (ou ID) :</label>
                <input type="text" class="form-control" placeholder="Ex: Enzo Cabrez">
            </div>

            <button type="submit" class="btn-submit">Valider la vente</button>
        </form>

        <div class="footer-links">
            <a href="index.html" class="btn-link">Déconnexion / Retour</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
