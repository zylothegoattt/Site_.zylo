<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Plage - Espace Commandes Entreprises</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h2>Bar Plage</h2>
            <p>Espace Partenaires — Passer une commande de stock</p>
        </header>

        <section class="form-section">
            <h3>Passer une commande</h3>
            <form id="orderForm">
                <div class="input-group">
                    <label for="orderItem">Article souhaité</label>
                    <select id="orderItem" required>
                    </select>
                </div>

                <div class="input-group">
                    <label for="orderQuantity">Quantité</label>
                    <input type="number" id="orderQuantity" min="1" value="10" required>
                </div>

                <button type="submit">Envoyer la commande au Bar Plage</button>
            </form>
        </section>

        <section class="history-section">
            <h3>Nos Commandes Récentes</h3>
            <table>
                <thead>
                    <tr>
                        <th>Article</th>
                        <th>Quantité</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody id="ordersList">
                    <tr>
                        <td>Bouteille de Champagne</td>
                        <td>20</td>
                        <td><span style="color: #ff7648;">En attente de livraison</span></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

<script>
function appliquerThemeEtNom() {
    const headerTitle = document.querySelector('header h2');
    if (headerTitle) headerTitle.textContent = "Bar Plage";

    const subTextPage = document.querySelector('header p');
    if (subTextPage && subTextPage.textContent.includes("Tropical Heights")) {
        subTextPage.textContent = subTextPage.textContent.replace("Tropical Heights", "Bar Plage");
    }

    if (document.title.includes("Bar Plage")) {
        document.title = document.title.replace("Tropical Heights", "Bar Plage");
    }

    let stylePlage = document.getElementById('theme-plage-style');
    if (!stylePlage) {
        stylePlage = document.createElement('style');
        stylePlage.id = 'theme-plage-style';
        stylePlage.innerHTML = `
            header h2, h3 { color: #ff7648 !important; }
            label { color: #0097b2 !important; font-weight: bold !important; }
            th { color: #0097b2 !important; background: #f0ece6 !important; }
            td { color: #2c3e50 !important; background: #ffffff !important; }
            input, select { 
                background: #faf9f6 !important; 
                color: #2c3e50 !important; 
                border: 1px solid #dcd6ce !important; 
            }
            input:focus, select:focus { 
                border-color: #0097b2 !important; 
                outline: none;
                box-shadow: 0 0 0 3px rgba(0, 151, 178, 0.1);
            }
            button[type="submit"], #orderForm button { 
                background: linear-gradient(90deg, #ff7648 0%, #ffa85c 100%) !important; 
                color: #ffffff !important; 
                border: none !important;
                font-weight: bold;
                text-transform: uppercase;
                cursor: pointer;
                box-shadow: 0 4px 12px rgba(255, 118, 72, 0.2);
            }
            button[type="submit"]:hover, #orderForm button:hover {
                opacity: 0.9 !important;
            }
        `;
        document.head.appendChild(stylePlage);
    }
}

appliquerThemeEtNom();

const enseigne = "Bar Plage";
let panier = [];
const entrepriseNom = localStorage.getItem('entrepriseConnectee') || "Entreprise Partenaire";

function chargerCartePourClients() {
    const articles = JSON.parse(localStorage.getItem('articlesBoutique')) || [];
    const select = document.getElementById('orderItem');
    if(!select) return;
    
    select.innerHTML = '<option value="">-- Choisir un produit --</option>';
    articles.forEach(article => {
        const option = document.createElement('option');
        option.value = article.nom;
        option.textContent = `${article.nom} (${article.prix}$)`;
        select.appendChild(option);
    });
}

document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const item = document.getElementById('orderItem').value;
    const qty = parseInt(document.getElementById('orderQuantity').value);
    
    if(!item || isNaN(qty) || qty <= 0) {
        alert("Veuillez sélectionner un article valide !");
        return;
    }
    
    const indexExiste = panier.findIndex(p => p.article === item);
    if(indexExiste > -1) {
        panier[indexExiste].quantite += qty;
    } else {
        panier.push({ article: item, quantite: qty });
    }
    
    afficherMonPanierCourant();
    document.getElementById('orderForm').reset();
});

function afficherMonPanierCourant() {
    const tbody = document.getElementById('ordersList');
    if(!tbody) return;
    tbody.innerHTML = '';
    
    if(panier.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#7f8c8d;">Votre panier est vide</td></tr>';
        return;
    }
    
    panier.forEach((p, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td style="color: #2c3e50 !important;">🛒 ${p.article}</td>
            <td style="color: #2c3e50 !important;">${p.quantite}</td>
            <td><button onclick="retirerDuPanier(${index})" style="background:#f0ece6; color:#ff7648; border:1px solid #e2ddd8; padding:3px 8px; border-radius:4px; cursor:pointer; font-weight:600;">Enlever</button></td>
        `;
        tbody.appendChild(row);
    });
    
    const rowValidation = document.createElement('tr');
    rowValidation.innerHTML = `
        <td colspan="3" style="text-align:center; padding-top: 15px;">
            <button onclick="validerLeTicketFinal()" style="background: linear-gradient(90deg, #ff7648 0%, #ffa85c 100%) !important; color: #ffffff; border:none; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer; width:100%; text-transform:uppercase; box-shadow: 0 4px 12px rgba(255, 118, 72, 0.2);">
                🚀 Envoyer la commande au ${enseigne}
            </button>
        </td>
    `;
    tbody.appendChild(rowValidation);
}

window.retirerDuPanier = function(index) {
    panier.splice(index, 1);
    afficherMonPanierCourant();
};

window.validerLeTicketFinal = function() {
    if(panier.length === 0) return;
    
    let commandesGlobales = JSON.parse(localStorage.getItem('commandesGlobales')) || [];
    const dateActuelle = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    
    commandesGlobales.push({
        id: Date.now(),
        heure: dateActuelle,
        entreprise: entrepriseNom,
        details: [...panier],
        statut: "Attente Paiement"
    });
    
    localStorage.setItem('commandesGlobales', JSON.stringify(commandesGlobales));
    
    alert("Votre commande groupée a bien été transmise !");
    panier = [];
    afficherMonPanierCourant();
    
    const tbody = document.getElementById('ordersList');
    if(tbody) tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#ff7648; font-weight:bold;">✅ Commande envoyée avec succès !</td></tr>';
};

chargerCartePourClients();
afficherMonPanierCourant();
</script>
</body>
</html>
